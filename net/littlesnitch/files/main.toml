# Little Snitch default configuration. Do not edit this file,
# changes will be overwritten.
#
# Override in /var/lib/littlesnitch/override/config/main.toml

# If a network connection is not matched by a rule, Little Snitch allows it.
# Change this setting to `true` to invert the behavior and deny all
# connections which are not explicitly allowed.
# Be careful if you don't have physical access to your machine! It is very
# easy to lock yourself out!
deny_by_default = false
