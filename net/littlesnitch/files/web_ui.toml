# Little Snitch Web UI default configuration. Do not edit this file,
# changes will be overwritten.
#
# Override in /var/lib/littlesnitch/override/config/web_ui.toml

bind_address = "127.0.0.1"
# Ports below 1024 work as well: the daemon binds the socket during startup
# while it still holds CAP_NET_BIND_SERVICE (granted by the shipped systemd
# service file) and drops the capability right afterwards.
bind_port = 3031

# If `ui_base_urls` is set, Little Snitch will check whether the HTML page
# was obtained from a server in the given list by checking the `Origin:`
# header of the http(s) request. This is to prevent Cross Site Request
# Forgery. If you bind to a publicly available interface, list all URLs
# where the service can be reached. If your server is not listed, a
# message "rejected WebSocket upgrade from disallowed origin" is logged
# and the web UI shows "Daemon offline — reconnecting…".
# If you omit the setting, no check is done and all origins are allowed.
ui_base_urls = ["http://127.0.0.1:3031", "http://localhost:3031"]

use_https = false   # Also configure key and cert if set to true!

# Hide the web service from the connections list and traffic history.
# Since each user interface update requires network communication via the
# web service, the first update would trigger an endless chain of updates.
# It's still a configuration option so that we don't hide anything silently.
# Note that you won't see any indication in the UI if you block the web UI
# with a rule when hiding from stats!
hide_self_from_stats = true

# Used only when use_https = true. If not specified, a temporary self-signed
# certificate is used.
# ssl_certificate_path = "/etc/littlesnitch/cert.pem"
# ssl_key_path = "/etc/littlesnitch/key.pem"

# Authentication runs in a separate helper process which keeps UID 0 (root) so
# that PAM and external authenticators can read /etc/shadow. By default this
# helper prevents that programs it executes regain root capabilities: it sets
# no_new_privs and clears its capability bounding set. Set this option to true
# if your PAM stack or external authenticator needs full root privileges, for
# example to switch users.
# Note: When the daemon is started by the shipped systemd service file,
# NoNewPrivileges=yes applies to the whole service and executed programs run
# without capabilities regardless of this setting. Override the service file
# if you really need a fully privileged authenticator.
# If you set this option, it must appear above the [authentication] section.
auth_helper_full_privileges = false

# Authentication options:
#
#   type = "none"               No authentication (default if section is omitted)
#   type = "system_account"     Authenticate using the current system user account
#   type = "shared_credentials" Single shared username/password
#   type = "external_authenticator"  Delegate to an external program
#
# Passwords are sent in clear text when http is used! Use https (TLS encryption)
# if you request passwords!
#
# Examples:

# ----------------------------------------------------------------------------

# [authentication]
# type = "system_account"
# restrict_to_group = "staff"   # optional, all groups allowed if not defined
# pam_service = "login"         # default is "login", any of /etc/pam.d/*
# Authentication using your system account (Linux username and password) requires
# libpam (Pluggable Authentication Module) support. Standard pre-built packages
# include libpam, musl based self-contained static binaryies don't.
# About `pam_service`: A PAM service configuration in /etc/pam.d defines how
# users are authenticated. By default, we use the same configuration as
# account login, but you can change to any other configuration and you can
# even write your own. Note, though, that many Linux distros silently fall
# back to "other" if the configuration does not exist.

# ----------------------------------------------------------------------------

# [authentication]
# type = "shared_credentials"
# user = "admin"
# password = "<argon2 hash -- run `daemon --hash-password` to generate>"

# ----------------------------------------------------------------------------

# [authentication]
# type = "external_authenticator"
# path = "/usr/local/bin/my-auth-script"
#
# The external authenticator script receives two lines on stdin: First username,
# then clear text password. If it terminates with exit code 0, the password is
# assumed to be correct. Otherwise login fails.
# The path to the external authenticator must be fully root-owned and must not
# contain symlinks or group- or world-writable components.
# The authenticator is executed as root, but without capabilities (see the
# auth_helper_full_privileges option above). It may therefore use PAM and read
# /etc/shadow, but it cannot use other root powers such as binding to low port
# numbers, doing chown on files etc.
