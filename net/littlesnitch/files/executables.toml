# Little Snitch executables default configuration. Do not edit this file,
# changes will be overwritten.
#
# Override in /var/lib/littlesnitch/override/config/executables.toml

# When determining the parent app of a process, the search for a parent can stop
# at the process which is responsible for starting processes in the user session.
# This can be systemd, the gnome shell or similar.
app_manager_globs = [
    "/usr/bin/bwrap",
    "/usr/bin/cinnamon",
    "/usr/bin/cinnamon-session",
    "/usr/bin/dbus-daemon",
    "/usr/bin/gnome-shell",
    "/usr/bin/kded5",
    "/usr/bin/kded6",
    "/usr/bin/kdeinit5",
    "/usr/bin/kdeinit6",
    "/usr/bin/ksmserver",
    "/usr/bin/lxqt-session",
    "/usr/bin/lxsession",
    "/usr/bin/mate-panel",
    "/usr/bin/mate-session",
    "/usr/bin/plasmashell",
    "/usr/bin/startx",
    "/usr/bin/xfce4-mime-helper",
    "/usr/bin/xfce4-session",
    "/usr/bin/xinit",
    "/usr/lib/*-linux-gnu/glib-*/gio-launch-desktop",
    "/usr/lib/systemd/systemd",
    "/usr/libexec/flatpak-session-helper",
    "/usr/libexec/gnome-session-binary",
]

# When determining the parent app of a process, shells are ignored. The standard
# set of shells is read from /etc/shells. Additional glob patterns can be given
# here.
additional_shell_globs = [
    "/snap/core*/*/usr/bin/bash",
    "/snap/core*/*/usr/bin/dash",
    "/nix/store/*/bin/bash",
    "/nix/store/*/bin/dash",
    "/nix/store/*/bin/fish",
    "/nix/store/*/bin/ksh",
    "/nix/store/*/bin/mksh",
    "/nix/store/*/bin/nu",
    "/nix/store/*/bin/sh",
    "/nix/store/*/bin/tcsh",
    "/nix/store/*/bin/zsh",
    "/usr/libexec/xdg-desktop-portal*",
]

# Normalize versioned executable paths to a common glob pattern so that
# connections from different versions of the same application are grouped
# together. Symlinks are resolved before matching.
# path_regex uses Rust regex syntax; replacement_glob uses capture group
# substitution (${1}, ${name}, etc.) and must produce a valid glob pattern.
# Normalization must be idempotent: applying it twice must yield the same result.
# The resulting glob patterns must match all connections that are matched by the
# regex because glob patterns are used in rules.

executable_normalization = [
    # Snaps encode the revision number in the path, e.g.:
    # /snap/firefox/7897/usr/lib/firefox/firefox
    {
        path_regex = "^(/snap/[^/]*)/[*0-9]+/(.*)$",
        replacement_glob = "${1}/*/${2}"
    },

    # VS Code extensions include a version suffix in the directory name, e.g.:
    # /home/user/.vscode/extensions/rust-lang.rust-analyzer-0.3.2/...
    {
        path_regex = "^(/home/[^/]+/[.]vscode(?:-oss)/extensions/[^/]*)-[*0-9][^/]*/(.*)$",
        replacement_glob = "${1}-*/${2}"
    },

    # Nix store (hash changes on every package update):
    # /nix/store/abc123...-firefox-123.0/bin/firefox
    {
        path_regex = "^/nix/store/[^/]+/(.*)$",
        replacement_glob = "/nix/store/*/${1}"
    },

    # Guix store (same pattern as Nix, different prefix):
    # /gnu/store/abc123...-bash-5.1/bin/bash
    {
        path_regex = "^/gnu/store/[^/]+/(.*)$",
        replacement_glob = "/gnu/store/*/${1}"
    },

    # Flatpak (deployment commit hash after branch, system and user installs):
    # /var/lib/flatpak/app/org.mozilla.firefox/x86_64/stable/HASH/files/bin/firefox
    # /home/user/.local/share/flatpak/app/org.mozilla.firefox/x86_64/stable/HASH/files/bin/firefox
    {
        path_regex = "^((?:/var/lib|/home/[^/]+/.local/share)/flatpak/app/[^/]+/[^/]+/[^/]+)/[^/]+/(.*)$",
        replacement_glob = "${1}/*/${2}"
    },

    # AppImage mounts (random suffix on mount directory):
    # /tmp/.mount_Firefox-Abc123/usr/bin/firefox
    {
        path_regex = "^/tmp/[.]mount_[^/]+/(.*)$",
        replacement_glob = "/tmp/.mount_*/${1}"
    },

    # JetBrains Toolbox (version number in channel directory):
    # /home/user/.local/share/JetBrains/Toolbox/apps/IDEA-U/ch-0/243.22562.145/bin/idea.sh
    {
        path_regex = "^(/home/[^/]+/.local/share/JetBrains/Toolbox/apps/[^/]+/ch-[0-9]+)/[*0-9][^/]*/(.*)$",
        replacement_glob = "${1}/*/${2}"
    },

    # nvm (Node Version Manager — version in path):
    # /home/user/.nvm/versions/node/v20.11.0/bin/node
    {
        path_regex = "^(/home/[^/]+/.nvm/versions/[^/]+)/v[*0-9][^/]*/(.*)$",
        replacement_glob = "${1}/v*/${2}"
    },

    # pyenv (Python version in path):
    # /home/user/.pyenv/versions/3.11.0/bin/python3.11
    {
        path_regex = "^(/home/[^/]+/.pyenv/versions)/[*0-9][^/]*/(.*)$",
        replacement_glob = "${1}/*/${2}"
    },

    # Java JDKs (version number in /usr/lib/jvm path, multiple JDKs coexist):
    # /usr/lib/jvm/java-17-openjdk-amd64/bin/java
    {
        path_regex = "^/usr/lib/jvm/java-[*0-9]+-([^/]+)/(.*)$",
        replacement_glob = "/usr/lib/jvm/java-*-${1}/${2}"
    },

    # rbenv (Ruby version manager):
    # /home/user/.rbenv/versions/3.2.0/bin/ruby
    {
        path_regex = "^(/home/[^/]+/.rbenv/versions)/[^/]+/(.*)$",
        replacement_glob = "${1}/*/${2}"
    },

    # rvm (Ruby Version Manager):
    # /home/user/.rvm/rubies/ruby-3.2.0/bin/ruby
    {
        path_regex = "^(/home/[^/]+/.rvm/rubies/ruby)-[^/]+/(.*)$",
        replacement_glob = "${1}-*/${2}"
    },

    # asdf (universal version manager — covers node, python, ruby, etc.):
    # /home/user/.asdf/installs/nodejs/20.0.0/bin/node
    {
        path_regex = "^(/home/[^/]+/.asdf/installs/[^/]+)/[^/]+/(.*)$",
        replacement_glob = "${1}/*/${2}"
    },

    # mise (modern asdf replacement):
    # /home/user/.local/share/mise/installs/node/20.0.0/bin/node
    {
        path_regex = "^(/home/[^/]+/.local/share/mise/installs/[^/]+)/[^/]+/(.*)$",
        replacement_glob = "${1}/*/${2}"
    },

    # Go SDK (managed by go toolchain — go itself fetches modules):
    # /home/user/sdk/go1.21.0/bin/go
    {
        path_regex = "^(/home/[^/]+/sdk/go)[*0-9][^/]*/(.*)$",
        replacement_glob = "${1}*/${2}"
    },

    # Homebrew/Linuxbrew Cellar (versioned installs under Cellar):
    # /home/linuxbrew/.linuxbrew/Cellar/node/20.0.0/bin/node
    {
        path_regex = "^(/home/[^/]+/.linuxbrew/Cellar/[^/]+)/[^/]+/(.*)$",
        replacement_glob = "${1}/*/${2}"
    },

    # SDKMAN (Java version manager):
    # /home/user/.sdkman/candidates/java/17.0.8-tem/bin/java
    {
        path_regex = "^(/home/[^/]+/.sdkman/candidates/[^/]+)/[^/]+/(.*)$",
        replacement_glob = "${1}/*/${2}"
    },

    # Electron squirrel-style auto-updater (versioned app- directories):
    # /home/user/.local/share/discord/app-1.0.45/discord
    {
        path_regex = "^(/home/[^/]+/.local/share/[^/]+/app)-[*0-9][^/]*/(.*)$",
        replacement_glob = "${1}-*/${2}"
    },

    # System-wide versioned installs under /opt:
    # /opt/discord-0.0.45/discord
    {
        path_regex = "^(/opt/[^/]+)-[*0-9][^/]*/(.*)$",
        replacement_glob = "${1}-*/${2}"
    },
]
