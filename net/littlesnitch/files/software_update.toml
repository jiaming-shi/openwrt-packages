# Little Snitch software update default configuration. Do not edit this file,
# changes will be overwritten.
#
# Override in /var/lib/littlesnitch/override/config/software_update.toml

# We have made the software update configurable to allow re-distributions
# to substitute their own software update channels in an override.

# This file consists of two sections of the same structure. One for stable
# releases and one for prereleases. Stable releases fetch their updates from
# the configuration in the `[stable]` section while prerelease versions
# update from the `[prerelease]` section. Stable releases can be distinguished
# from prereleases by a `-pre*` suffix in the version number.

#############################################################################
[stable]
#############################################################################

# This setting defines how often `current_version_url` is loaded to check
# for the latest version. If it is set to 0, no automatic check is performed,
# but a manual check in the "About" dialog is still possible. We choose one
# week to have a gradual rollout of new versions.
update_interval_hours = 168

# This is the URL where we obtain the latest version number. The file is
# expected to contain one line of text with the semantic version (3 numbers
# separated by dots, e.g. 1.2.3, with an optional prerelase suffix, e.g.
# 1.2.3-pre4 or 1.0.5-beta02). When deciding whether a version is newer than
# the currently installed one, the numeric part is compared numerically and
# the prerelease is compared as string (pre10 is sorted *before* pre9).
# If no `current_version_url` is given, the software update service is
# not available.
current_version_url = "https://sw-update.obdev.at/update-feeds/littlesnitch-linux.php"

# This setting is a template for an URL where the new version can be
# downloaded. The variable "$arch" is replaced with the CPU architecture of
# the currently running binary as provided by Rust (e.g. "x86_64" or
# "aarch64"). It can be used to narrow down the number of packets offered.
# "$static" is replaced with "true" if this is a statically linked binary and
# "false" otherwise. It can also be used to narrow down the packets offered.
# "$current_version" is replaced with the currently installed version number.
# It can be used to show release notes only for versions newer than the
# currently installed one.
# If no `download_url_template` is given, no update link is presented to
# the user.
download_url_template = "https://obdev.at/littlesnitch-linux/download-swu.php?arch=$arch&static=$static&currentVersion=$current_version"

#############################################################################
[prerelease]
#############################################################################

update_interval_hours = 24
current_version_url = "https://sw-update.obdev.at/update-feeds/littlesnitch-linux.php?channel=prerelease"
download_url_template = "https://obdev.at/littlesnitch-linux/download-swu.php?channel=prerelease&arch=$arch&static=$static&currentVersion=$current_version"
